<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoGo Companion</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>PoGo Companion</h1>

<p>Your Pokémon GO Raid Assistant</p>

</header>



<main>


<div class="search-box">

<input 
type="text"
placeholder="Search Pokémon..."
>

<button>
Search
</button>

</div>



<h2>Raid Attacker Rankings</h2>


<div class="type-grid">


<div class="type fire">
🔥 Fire
</div>


<div class="type water">
💧 Water
</div>


<div class="type dragon">
🐉 Dragon
</div>


<div class="type electric">
⚡ Electric
</div>


<div class="type ice">
❄️ Ice
</div>


<div class="type fighting">
🥊 Fighting
</div>


</div>



<h2>Current Pokémon GO Events</h2>


<div class="card">

<p>
Event information coming soon.
</p>

</div>


</main>


</body>

</html>
