<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoGo Companion</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>PoGo Companion</h1>

</header>



<main>


<section class="search-section">

<input 
type="text"
placeholder="Search Pokémon..."
>

</section>



<section>

<details class="type-menu">

<summary>
Types <span>▼</span>
</summary>

<div class="type-grid">

<div class="type normal">
Normal
</div>

<div class="type fire" onclick="showType('Fire')">
Fire
</div>

<div class="type water" onclick="showType('Water')">
Water
</div>

<div class="type electric">
Electric
</div>

<div class="type grass">
Grass
</div>

<div class="type ice">
Ice
</div>

<div class="type fighting">
Fighting
</div>

<div class="type poison">
Poison
</div>

<div class="type ground">
Ground
</div>

<div class="type flying">
Flying
</div>

<div class="type psychic">
Psychic
</div>

<div class="type bug">
Bug
</div>

<div class="type rock">
Rock
</div>

<div class="type ghost">
Ghost
</div>

<div class="type dragon">
Dragon
</div>

<div class="type dark">
Dark
</div>

<div class="type steel">
Steel
</div>

<div class="type fairy">
Fairy
</div>

</div>

</details>

</section>

<section>

<details class="event-menu">

<summary>
Pokémon GO Events
</summary>


<div class="event-buttons">


<button class="live-button" onclick="showEvents('live')">
🔴 LIVE
</button>


<div class="event-row">

<button onclick="showEvents('raid')">
⚔️ Raids
</button>

<button onclick="showEvents('spotlight')">
⭐ Spotlight Hour
</button>

<button onclick="showEvents('community')">
🌱 Community Day
</button>

</div>


<div class="event-row">

<button onclick="showEvents('special')">
🎉 Special Events
</button>

<button onclick="showEvents('research')">
🔬 Research
</button>

<button onclick="showEvents('max')">
⚡ Max Battles
</button>

</div>


<div class="event-row">

<button onclick="showEvents('gbl')">
🏆 GO Battle League
</button>

<button onclick="showEvents('season')">
🌎 Seasonal
</button>

<button onclick="showEvents('events')">
📌 Other
</button>

</div>


</div>


<div id="event-list" class="card">

<h3>Pokémon GO Events</h3>

<p>
Select a category above to view events.
</p>

</div>


</details>

</section>

</main>

<script src="js/app.js?v=2"></script>

</body>

</html>
