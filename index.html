<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoGo Companion</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>PoGo Companion</h1>

</header>



<main>


<section class="search-section">

<input 
type="text"
placeholder="Search Pokémon..."
>

</section>



<section>

<h2>Raid Attacker Rankings</h2>

<div class="type-grid">


<div class="type normal">
Normal
</div>


<div class="type fire" onclick="showType('Fire')">
Fire
</div>


<div class="type water" onclick="showType('Water')">
Water
</div>


<div class="type electric">
Electric
</div>


<div class="type grass">
Grass
</div>


<div class="type ice">
Ice
</div>


<div class="type fighting">
Fighting
</div>


<div class="type poison">
Poison
</div>


<div class="type ground">
Ground
</div>


<div class="type flying">
Flying
</div>


<div class="type psychic">
Psychic
</div>


<div class="type bug">
Bug
</div>


<div class="type rock">
Rock
</div>


<div class="type ghost">
Ghost
</div>


<div class="type dragon">
Dragon
</div>


<div class="type dark">
Dark
</div>


<div class="type steel">
Steel
</div>


<div class="type fairy">
Fairy
</div>


</div>



</div>


</section>




<section>
<section id="results">

</section>
<h2>Pokémon GO Events</h2>


<div class="card">

<h3>Current & Upcoming Events</h3>

<p>
Event information will appear here.
</p>

</div>


</section>



</main>

<script src="js/app.js"></script>

</body>

</html>
